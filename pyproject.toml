[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tram"
version = "0.1.1"
description = "Governance layer for AI coding agents - the rails, not the engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.24"]
orchestration = ["langgraph>=0.2"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.4",
    "httpx>=0.27",
]

[project.scripts]
tram = "tram.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tram"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["tram"]
