name: release

# Push a v* tag to build and publish binaries (Windows x64 / macOS arm64).
# workflow_dispatch builds artifacts without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: tram-windows-x64
          - os: macos-latest
            asset: tram-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,ui]" pyinstaller

      # The suite assumes POSIX commands (true/false gate checks); packaging is
      # what the release exercises on Windows, correctness is covered by ci.yml.
      - name: Run tests
        if: runner.os != 'Windows'
        run: python -m pytest -q

      - name: Build binary
        shell: bash
        run: |
          SEP=":"; [ "${{ runner.os }}" = "Windows" ] && SEP=";"
          python -m PyInstaller --noconfirm --clean --onefile --name tram \
            --paths src \
            --add-data "src/tram/governance/policies${SEP}tram/governance/policies" \
            --add-data "src/tram/artifacts/templates${SEP}tram/artifacts/templates" \
            --add-data "src/tram/ui/static${SEP}tram/ui/static" \
            --collect-all uvicorn \
            scripts/launcher.py

      - name: Smoke the binary
        shell: bash
        run: |
          BIN="dist/tram"; [ -f "dist/tram.exe" ] && BIN="dist/tram.exe"
          "$BIN" --help

      - name: Package
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "${{ matrix.asset }}.zip" ./dist/tram.exe
          else
            zip -j "${{ matrix.asset }}.zip" dist/tram
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: assets

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*.zip
          generate_release_notes: true
          body: |
            独立二进制（无需 Python）：

            - `tram-windows-x64.zip` → Windows x64：解压得到 `tram.exe`
            - `tram-macos-arm64.zip` → Apple Silicon：解压得到 `tram`

            macOS 首次运行如被 Gatekeeper 拦截：`xattr -d com.apple.quarantine tram` 或
            系统设置 → 隐私与安全性 → 仍要打开。Intel Mac 请 `pip install tram`。
